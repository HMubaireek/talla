plugins {
    id 'com.android.application'
}

// versionCode = the CI run (it only grows, and «التحديث من الهاتف» compares it); versionName = 2.<runs since 2.0's>.
// VERSION_BASE is the run number of the 2.0 build on master; a new major version sets the major and a new base.
def RUN = (System.getenv('GITHUB_RUN_NUMBER') ?: '0') as int
def VERSION_BASE = 9

android {
    namespace 'sa.talla'
    compileSdk 34

    defaultConfig {
        applicationId 'sa.talla'
        minSdk 26
        targetSdk 34
        versionCode Math.max(RUN, 1)
        versionName "2.${Math.max(RUN - VERSION_BASE, 0)}"
    }

    signingConfigs {
        // the key lives only in the repository's secrets and on the owner's PC, never in the repo; without ANDROID_KEYSTORE
        // a build gets the debug key, which can't update the installed app
        if (System.getenv('ANDROID_KEYSTORE')) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'baytiauto'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.car.app:app:1.7.0'
}

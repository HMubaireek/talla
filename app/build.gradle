plugins {
    id 'com.android.application'
}

android {
    namespace 'sa.bayti.auto'
    compileSdk 34

    defaultConfig {
        applicationId 'sa.bayti.auto'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        // the key lives only in the repository's secrets and on the owner's PC, never in the repo; without ANDROID_KEYSTORE
        // a build gets the debug key, which can't update the installed app
        if (System.getenv('ANDROID_KEYSTORE')) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'baytiauto'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.car.app:app:1.7.0'
}

name: Android

# Builds the signed release APK and publishes it to the apk-latest release
# (fixed link: .../releases/download/apk-latest/bayti-auto.apk). Started by hand, or by a push to master.
# A push to a claude/ branch only builds (a check before master); it publishes nothing.
on:
  workflow_dispatch:
  push:
    branches: [master, 'claude/**']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # the signing key lives only in the repository's secrets (and on the owner's PC), never in the repo
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD must both be in the repository's secrets"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk bayti-auto.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bayti-auto
          path: bayti-auto.apk

      - name: Publish to the apk-latest release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Bayti Auto (latest)
          body: The newest signed build. Install it with UnknownAuto or KingInstaller (see the README), not by tapping the file.
          files: bayti-auto.apk
          make_latest: true
